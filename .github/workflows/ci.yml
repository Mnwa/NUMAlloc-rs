name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test

  fuzz-smoke:
    name: AFL++ smoke fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_AFL_VERSION: "0.18.2"
      AFL_SKIP_CPUFREQ: "1"
      AFL_NO_AFFINITY: "1"
      AFL_NO_UI: "1"
      AFL_FAST_CAL: "1"
      AFL_CMPLOG_ONLY_NEW: "1"
      AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-afl
            fuzz/afl/target
          key: ${{ runner.os }}-cargo-afl-${{ env.CARGO_AFL_VERSION }}-${{ hashFiles('**/Cargo.lock', 'fuzz/afl/Cargo.toml') }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
      - name: Install pinned cargo-afl
        run: command -v cargo-afl >/dev/null || cargo install cargo-afl --version "$CARGO_AFL_VERSION" --locked
      - name: Replay seed corpus and regression inputs (no AFL++)
        working-directory: fuzz/afl
        run: cargo test --release
      - name: Build fuzz targets
        working-directory: fuzz/afl
        run: cargo afl build --release
      - name: Smoke fuzz alloc_ops (60 s)
        working-directory: fuzz/afl
        run: scripts/smoke.sh alloc_ops 60 artifacts/ci-alloc_ops
      - name: Smoke fuzz alloc_threads (60 s)
        working-directory: fuzz/afl
        run: scripts/smoke.sh alloc_threads 60 artifacts/ci-alloc_threads
      - name: Upload AFL++ output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afl-artifacts-${{ github.run_id }}
          path: fuzz/afl/artifacts
          if-no-files-found: ignore
          retention-days: 14
