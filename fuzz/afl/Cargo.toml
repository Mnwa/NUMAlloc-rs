[package]
name = "numalloc-afl"
version = "0.0.0"
edition = "2024"
publish = false
description = "AFL++ fuzz targets for the numalloc allocator (not published)"

[dependencies]
afl = "0.18"
numalloc = { path = "../..", features = ["fuzz-hooks"] }

[[bin]]
name = "alloc_ops"
path = "src/bin/alloc_ops.rs"
test = false
doc = false

[[bin]]
name = "alloc_threads"
path = "src/bin/alloc_threads.rs"
test = false
doc = false

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
test = false
doc = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# Standalone workspace: keeps the afl dependency and lockfile out of the
# main crate's build graph.
[workspace]
