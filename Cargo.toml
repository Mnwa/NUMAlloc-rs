[package]
name = "numalloc"
version = "0.1.1"
edition = "2024"
description = "A blazing-fast, NUMA-aware memory allocator written in pure Rust"
license = "MIT"
repository = "https://github.com/Mnwa/NUMAlloc-rs"
homepage = "https://github.com/Mnwa/NUMAlloc-rs"
documentation = "https://docs.rs/numalloc"
authors = ["Mikhail Panfilov <mikhail@panfilov.biz>"]
readme = "README.md"
keywords = ["allocator", "numa", "memory", "performance", "lock-free"]
categories = ["memory-management", "concurrency"]

[features]
# Exposes `NumaAlloc::with_config`, `NumaAlloc::validate_internal_state` and a
# few metadata accessors for tests and fuzz harnesses.  Never enable this in
# production builds: it adds fields to `NumaAlloc` and public unsafe entry
# points that assume a quiescent allocator.
internal-testing = []

[dependencies]
libc = "0.2"

[dev-dependencies]
# Self dev-dependency: enables the internal-testing hooks for this crate's
# own tests and benches without affecting downstream builds.
numalloc = { path = ".", features = ["internal-testing"] }
criterion = { version = "0.8", features = ["html_reports"] }
mimalloc = { version = "0.1", default-features = false }
tikv-jemallocator = "0.6"

[[bench]]
name = "allocator_comparison"
harness = false
